  # dev tools, SaaS, self-hosted tools, AI, game dev. Game-discovery subs are
  # intentionally NOT duplicated here (Roblox/Steam already covered by sentinels).

  - id: "reddit-sideproject"
    name: "Reddit SideProject"
    api: "reddit"
    subreddit: "SideProject"

